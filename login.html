<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In | Pebblio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #ffffff;
    --bg-soft: #f6f7f9;
    --ink: #14171f;
    --muted: #5b6472;
    --accent: #5b4fe8;
    --accent-dark: #453bc4;
    --accent-ink: #ffffff;
    --border: #e4e6ec;
    --danger: #d94848;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: var(--ink);
    background: var(--bg-soft);
  }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: 16px 32px; background: var(--bg); border-bottom: 1px solid var(--border);
  }
  .topbar__logo-img{ height: 30px; width: auto; display: block; }
  .topbar__signup{ font-size:0.9rem; color: var(--muted); }
  .topbar__signup a{ color: var(--accent); font-weight:600; text-decoration:none; }

  main{ max-width: 420px; margin: 0 auto; padding: 64px 20px; }
  h1{ font-size:1.6rem; margin:0 0 6px; }
  .subtitle{ color: var(--muted); margin:0 0 28px; font-size:0.95rem; }

  .form-card{
    background: var(--bg); border:1px solid var(--border);
    border-radius:14px; padding:28px;
  }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:0.85rem; font-weight:600; margin-bottom:6px; }
  .field input{
    width:100%; padding:10px 12px; border:1px solid var(--border);
    border-radius:8px; font-size:0.95rem; font-family:inherit;
  }
  .field input:focus{
    outline:none; border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(91,79,232,0.12);
  }
  .error-msg{
    color: var(--danger); font-size:0.85rem; margin: -6px 0 16px; display:none;
  }
  .error-msg.show{ display:block; }

  .btn{
    font-family:inherit; font-size:0.95rem; font-weight:600;
    padding:11px 20px; border-radius:8px; cursor:pointer;
    border:1px solid transparent; width:100%;
    background: var(--accent); color:#fff;
  }
  .btn:hover{ background: var(--accent-dark); }
</style>
</head>
<body>

<div class="topbar">
  <a href="index.html"><img src="pebblio-logo.png" alt="Pebblio" class="topbar__logo-img"></a>
  <div class="topbar__signup">New here? <a href="signup.html">Create an account</a></div>
</div>

<main>
  <h1>Welcome back</h1>
  <p class="subtitle">Log in to your Pebblio account.</p>

  <div class="form-card">
    <form onsubmit="return handleLogin(event)">
      <div class="field">
        <label>Email</label>
        <input type="email" id="login-email" required>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="login-password" required>
      </div>
      <div class="error-msg" id="login-error">That email or password isn't right.</div>
      <button type="submit" class="btn">Log In</button>
    </form>
  </div>
</main>

<script src="auth.js"></script>
<script>
  // Already logged in? No need to see this page.
  const existingUser = getCurrentUser();
  if (existingUser){
    window.location.href = dashboardUrlFor(existingUser.role);
  }

  async function handleLogin(e){
    e.preventDefault();
    const email = document.getElementById('login-email').value.trim().toLowerCase();
    const password = document.getElementById('login-password').value;
    const errorEl = document.getElementById('login-error');

    const user = getUsers().find(u => u.email.trim().toLowerCase() === email);
    if (!user){
      errorEl.classList.add('show');
      return false;
    }

    const hash = await sha256Hex(password);
    if (hash !== user.passwordHash){
      errorEl.classList.add('show');
      return false;
    }

    errorEl.classList.remove('show');
    setCurrentUser(user.userId);
    window.location.href = dashboardUrlFor(user.role);
    return false;
  }
</script>

</body>
</html>
